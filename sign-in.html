<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
<header class="header">
<nav class="navbar">
<a href="home.html" class="logo">Elite Spinny</a>
<div class="nav-links"><a href="home.html#cars">Browse Cars</a><a href="#">Sell</a><a href="#">Finance</a><a href="#">About</a></div>
<div class="nav-actions"><span class="search-icon">⌕</span><a href="sign-in.html" class="signin-button">Sign In</a></div>
</nav>
</header>

<main class="signin-page">
<div class="signin-container">
<h1>Welcome Back</h1>
<p>Sign in to your Elite Spinny account</p>
<form>
<div class="form-group"><label for="email">Email Address</label><input type="email" id="email" placeholder="name@example.com" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Enter your password" required></div>
<div class="form-options"><label class="remember"><input type="checkbox"> Remember me</label><a href="#">Forgot Password?</a></div>
<button type="submit" class="signin-submit">Sign In</button>
</form>
<div class="create-account"><p>Don't have an account? <a href="#">Create One</a></p></div>
</div>
</main>

<footer class="footer">
<div class="footer-logo">Elite Spinny</div>
<div class="footer-links"><a href="#">Privacy Policy</a><a href="#">Terms of Service</a><a href="#">Contact Us</a><a href="#">Careers</a></div>
<p>© 2026 Elite Spinny. All rights reserved.</p>
</footer>
</body>
</html>
